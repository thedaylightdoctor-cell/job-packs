<body>
<title>Daylight Doctor Job Packs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a one-column phone app; sticky navy bar, stacked survey sections, big touch targets */
:root{
  --navy:#17344a; --navy-ink:#ffffff; --sun:#f2b632; --sun-soft:#fff4d6;
  --bg:#f3f6f8; --surface:#ffffff; --ink:#1f2e38; --muted:#5a6c78; --line:#dbe4ea;
  --field:#f8fafb; --accent:#2a6f9e; --good:#22805a; --warn:#a86a00; --bad:#b3362c;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0e2232; --navy-ink:#f1f5f8; --sun:#f2b632; --sun-soft:#3a2f12;
  --bg:#0c1820; --surface:#13242f; --ink:#e6edf2; --muted:#9db0bd; --line:#26404f;
  --field:#0f1f29; --accent:#6db3e0; --good:#5cc597; --warn:#e9b44c; --bad:#ef7d72; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0e2232; --navy-ink:#f1f5f8; --sun:#f2b632; --sun-soft:#3a2f12;
  --bg:#0c1820; --surface:#13242f; --ink:#e6edf2; --muted:#9db0bd; --line:#26404f;
  --field:#0f1f29; --accent:#6db3e0; --good:#5cc597; --warn:#e9b44c; --bad:#ef7d72; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-ink)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:58px}
.mark{width:40px;height:40px;border-radius:10px;background:#fff;flex:none;object-fit:cover}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-weight:800;letter-spacing:.06em;font-size:13px}
.brand span{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.28);color:var(--navy-ink);border-radius:10px;min-height:40px;padding:0 12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.savestate{font-size:12px;opacity:.8;white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:650;cursor:pointer;text-decoration:none}
.btn-sun{background:var(--sun);border-color:var(--sun);color:#1b2a33}
.btn-navy{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn-navy{color:#0c1820}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-navy{color:#0c1820}}
.btn-ghost{background:transparent}
.btn-danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn-block{width:100%}
.btn:disabled{opacity:.55;cursor:progress}

/* jobs list */
main{padding-block:18px 120px}
.hello{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
.hello h1{font-size:24px;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
.hello p{margin:4px 0 0;color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jobs{display:grid;gap:10px}
.job{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.job h3{margin:0;font-size:16px;min-width:0;overflow-wrap:anywhere}
.job .meta{grid-column:1/-1;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px}
.ref{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:4px 9px;align-self:start;white-space:nowrap}
.st-survey{background:var(--sun-soft);color:var(--warn)}
.st-quoted{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.st-booked{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.st-done{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}
.notice{background:var(--sun-soft);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.example-tag{font-size:11px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.06em}

/* editor */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.sec > h2{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 16px 0}
.sec .body{padding:12px 16px 16px;display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr}.grid2.keep,.grid3.keep{grid-template-columns:repeat(2,minmax(0,1fr))}}
label.f{display:grid;gap:5px;min-width:0}
label.f > span{font-size:12px;font-weight:600;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],select,textarea{width:100%;min-height:46px;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{min-height:88px;resize:vertical}
input.code{font-family:var(--mono);text-transform:uppercase;letter-spacing:.02em}
input.code::placeholder{text-transform:none;font-family:var(--font);letter-spacing:0}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 0 0}
.hint b{font-family:var(--mono);color:var(--ink);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:42px;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:0 12px;font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.win{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.win-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--field);border-bottom:1px solid var(--line)}
.win-num{font-family:var(--mono);font-weight:600;background:var(--navy);color:var(--navy-ink);border-radius:8px;padding:3px 8px;font-size:13px}
.win-head strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win .body{padding:12px}
.sub{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
@media (max-width:520px){.photos{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ph{background:var(--field);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph .cap{display:flex;gap:4px;padding:6px}
.ph .cap input{min-height:36px;font-size:14px;padding:6px 8px}
.ph .x{border:0;background:transparent;color:var(--bad);font-weight:700;padding:0 8px;cursor:pointer;min-width:36px}
.capchips{display:flex;flex-wrap:wrap;gap:4px;padding:0 6px 6px}
.capchips button{font-size:11px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 8px;cursor:pointer}
.addph{display:flex;gap:8px;flex-wrap:wrap}
.addph label{cursor:pointer}
.addph input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{display:flex;gap:10px;padding-block:10px}
.dock .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:9;max-width:calc(100% - 32px);text-align:center}
.mats{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.mats li{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:13px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.mats li span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.danger-zone{display:flex;justify-content:center;padding-top:6px}
@media (prefers-reduced-motion:no-preference){.job,.btn,.chipbtn{transition:transform .12s ease}.job:active,.btn:active{transform:scale(.985)}}
</style>

<script>
(function(){
"use strict";

/* ---------- Reference data from the quoting rules ---------- */
const CONVERSIONS = [
  [/^GGL\s*-?\s*1$/,'MK04 (78×98)'],[/^GGL\s*-?\s*2$/,'MK08 (78×140)'],[/^GGL\s*-?\s*3$/,'PK10 (94×160)'],
  [/^GGL\s*-?\s*4$/,'SK06 (114×118). Single or combined?'],[/^(GGL|TGL)\s*-?\s*5$/,'FK06 (66×118). Add uPVC trim, EW/EL FK06 6000'],
  [/^GGL\s*-?\s*6$/,'CK04 (55×98)'],[/^GGL\s*-?\s*7$/,'UK04 (134×98). Never PK10'],[/^GGL\s*-?\s*8$/,'UK08 (134×140). Check compatibility'],
  [/^GGL\s*104$/,'CK04. Check plate'],[/^(GGL|GHL)\s*206$/,'FK06. Verify operation and fit'],[/^GGL\s*308$/,'MK08'],
  [/^GGL\s*410$/,'PK10, GGU or GPU per approved operation'],[/^GHL\s*M04$/,'MK04'],[/^(GHL|GPL)\s*M06$/,'MK06'],
  [/^GGL\s*S06$/,'SK06. Check pitch'],[/^GGL\s*C02$/,'CK02']
];
const ROOFS = ['Plain tile','Profiled tile','Interlocking tile','Natural slate','Fibre-cement slate','Other'];
const FLASH_HINT = {'Plain tile':'EDP','Profiled tile':'EDW','Interlocking tile':'EDW','Natural slate':'EDL (check slate profile)','Fibre-cement slate':'EDL (check slate profile)'};
const STATUSES = [['survey','Surveyed'],['quoted','Quoted'],['booked','Booked'],['done','Complete']];
const MAKES = ['VELUX','Keylite','Roto','Fakro','Other'];
const OPS = ['Centre pivot','Top hung','Low pitch (GBL)','Electric / solar','Other'];
const CAPS = ['ID plate','Inside','Outside','Reveal','Access','Roof'];

/* ---------- Storage (IndexedDB with in-memory fallback) ---------- */
let dbh = null, storageOK = true;
const mem = new Map();
function openDB(){
  return new Promise(res=>{
    try{
      const r = indexedDB.open('dd-jobpacks',1);
      r.onupgradeneeded = ()=>{ r.result.createObjectStore('jobs',{keyPath:'id'}); };
      r.onsuccess = ()=>{ dbh=r.result; res(); };
      r.onerror = ()=>{ storageOK=false; res(); };
      r.onblocked = ()=>{ storageOK=false; res(); };
    }catch(e){ storageOK=false; res(); }
  });
}
function tx(mode, fn){
  return new Promise((res,rej)=>{
    try{ const t=dbh.transaction('jobs',mode); const s=t.objectStore('jobs'); const out=fn(s); t.oncomplete=()=>res(out&&out.result); t.onerror=()=>rej(t.error); }
    catch(e){ rej(e); }
  });
}
async function allJobs(){
  if(dbh){ try{ return await tx('readonly',s=>s.getAll()) || []; }catch(e){ storageOK=false; } }
  return [...mem.values()];
}
async function putJob(j){
  mem.set(j.id, j);
  if(dbh){ try{ await tx('readwrite',s=>s.put(j)); return true; }catch(e){ storageOK=false; } }
  return false;
}
async function delJob(id){
  mem.delete(id);
  if(dbh){ try{ await tx('readwrite',s=>s.delete(id)); }catch(e){} }
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* ---------- Model ---------- */
const uid = ()=> Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const today = ()=> new Date().toISOString().slice(0,10);
function newWindow(){
  return {id:uid(), room:'', make:'VELUX', existing:'', w:'', h:'', pitch:'', op:'Centre pivot', newCode:'', flashing:'', adaptor:'', blind:'', trim:false, combo:false, scaffold:false, notes:'', photos:[]};
}
function newJob(){
  return {id:uid(), created:Date.now(), updated:Date.now(), status:'survey', ref:'', surveyDate:today(), surveyor:'Ian', installers:'', installDate:'',
    customer:{name:'',phone:'',email:'',address:'',postcode:''},
    site:{property:'', roof:'Plain tile', storeys:'', access:'Stairs', accessNotes:'', inside:'Yes', scaffold:'Not needed', parking:'', hazards:'', clearRooms:true},
    windows:[newWindow()], notes:'', photos:[]};
}
function exampleJob(){
  const j = newJob();
  j.example = true; j.ref='EXAMPLE'; j.status='quoted'; j.surveyDate=today(); j.installers='Two-person team';
  j.customer = {name:'Example customer (sample job)', phone:'07000 000000', email:'', address:'1 Sample Road, Waterlooville', postcode:'PO7 0XX'};
  j.site = {property:'Semi-detached, loft conversion', roof:'Profiled tile', storeys:'2', access:'Stairs', accessNotes:'Narrow top landing, dust sheets on stairs', inside:'Yes', scaffold:'Not needed', parking:'Driveway, room for van', hazards:'Dog in the house, customer will keep it in the garden', clearRooms:true};
  const a = newWindow(); Object.assign(a,{room:'Bedroom 2 (front)', existing:'GGL 4', w:'1140', h:'1180', pitch:'40', newCode:'GGU SK06 0070', flashing:'EDW SK06 1000', notes:'Lining sound. Slight staining on lower reveal, customer aware.'});
  const b = newWindow(); Object.assign(b,{room:'Landing', existing:'GGL 6', w:'550', h:'980', pitch:'40', newCode:'GGU CK04 0070', flashing:'EDW CK04 1000', blind:'DKL CK04 1025SWL'});
  j.windows=[a,b];
  j.notes='Customer working from home, please knock at side door. Leave old windows in the skip bag on the drive.';
  return j;
}
function suggestFor(code){
  const c=(code||'').toUpperCase().trim().replace(/\s+/g,' ');
  if(!c) return '';
  for(const [re,s] of CONVERSIONS){ if(re.test(c)) return s; }
  return '';
}
function materials(job){
  const m = new Map();
  const add=(code)=>{ const k=(code||'').toUpperCase().trim().replace(/\s+/g,' '); if(k) m.set(k,(m.get(k)||0)+1); };
  job.windows.forEach(w=>{ add(w.newCode); add(w.flashing); add(w.adaptor); add(w.blind); });
  const trims = job.windows.filter(w=>w.trim).length;
  const out=[...m.entries()];
  if(trims) out.push(['uPVC finishing trim', trims]);
  return out;
}
function photoCount(j){ return j.photos.length + j.windows.reduce((n,w)=>n+w.photos.length,0); }
function statusLabel(s){ return (STATUSES.find(x=>x[0]===s)||STATUSES[0])[1]; }
function fmtDate(d){ if(!d) return ''; const t=new Date(d+'T12:00:00'); if(isNaN(t)) return d; return t.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }

/* ---------- Helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
function h(tag, attrs, ...kids){
  const el=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null || v===false) continue;
    if(k==='class') el.className=v; else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(k==='text') el.textContent=v; else el.setAttribute(k, v===true?'':v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(c)); }
  return el;
}
let toastT;
function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, ms); }

/* ---------- State ---------- */
let jobs=[], current=null, filter='all', saveT=null;
async function load(){
  await openDB();
  jobs = await allJobs();
  if(!jobs.length && !lsGet('dd-seeded')){ const e=exampleJob(); await putJob(e); jobs=[e]; lsSet('dd-seeded','1'); }
  showList();
}
function touch(){
  current.updated = Date.now();
  const st=$('#saveState'); st.hidden=false; st.textContent='Saving…';
  clearTimeout(saveT);
  saveT = setTimeout(async()=>{ const ok=await putJob(current); st.textContent = ok ? 'Saved' : 'Not saved on this phone'; }, 400);
}

/* ---------- Jobs list ---------- */
function showList(){
  current=null; window.scrollTo(0,0);
  $('#backBtn').hidden=true; $('#saveState').hidden=true; $('#barSub').textContent='Survey job packs';
  const dock=$('#dock'); dock.hidden=false;
  $('#dockInner').replaceChildren(h('button',{class:'btn btn-sun btn-block',onclick:startNew},'+ New survey'));
  const app=$('#app'); app.replaceChildren();
  app.append(h('div',{class:'hello'},
    h('div',null,h('h1',null,'Jobs'),h('p',null,'Fill in a survey on site, then send the job pack to the installers.'))));
  if(!storageOK) app.append(h('div',{class:'notice'},'This browser isn’t saving jobs. Make and send the job pack before you close the page.'));
  const fl=h('div',{class:'filters',role:'group','aria-label':'Filter jobs'});
  [['all','All'],...STATUSES].forEach(([k,l])=>fl.append(h('button',{class:'chipbtn','aria-pressed':String(filter===k),onclick:()=>{filter=k;showList();}},l)));
  app.append(fl);
  const list=h('div',{class:'jobs'});
  const shown = jobs.filter(j=>filter==='all'||j.status===filter).sort((a,b)=>b.updated-a.updated);
  if(!shown.length) list.append(h('div',{class:'empty'}, filter==='all' ? 'No jobs yet. Tap New survey to start one.' : 'No jobs with this status.'));
  shown.forEach(j=>{
    const n=j.windows.length, p=photoCount(j);
    list.append(h('button',{class:'job',onclick:()=>openJob(j.id)},
      h('div',null, j.example?h('div',{class:'example-tag'},'Example, safe to delete'):null, h('h3',null,j.customer.name||'Unnamed customer')),
      h('span',{class:'pill st-'+j.status},statusLabel(j.status)),
      h('div',{class:'meta'},
        h('span',null,[j.customer.postcode,j.customer.address.split(',').slice(-1)[0]].filter(Boolean).join(' · ')||'No address yet'),
        h('span',null,n+' window'+(n===1?'':'s')),
        h('span',null,p+' photo'+(p===1?'':'s')),
        j.ref?h('span',{class:'ref'},j.ref):null,
        h('span',null,'Survey '+fmtDate(j.surveyDate)))));
  });
  app.append(list);
}
async function startNew(){ const j=newJob(); jobs.push(j); await putJob(j); openJob(j.id); }

/* ---------- Editor ---------- */
function getP(o,p){ return p.split('.').reduce((a,k)=>a==null?a:a[k],o); }
function setP(o,p,v){ const ks=p.split('.'); const last=ks.pop(); const t=ks.reduce((a,k)=>a[k],o); t[last]=v; }
function field(obj, path, label, opts={}){
  const id='f-'+(opts.idp||'')+path.replace(/\./g,'-');
  let input;
  const v=getP(obj,path);
  if(opts.options){
    input=h('select',{id}, opts.options.map(o=>{ const [val,lab]=Array.isArray(o)?o:[o,o]; return h('option',{value:val,selected:val===v},lab); }));
  }else if(opts.area){
    input=h('textarea',{id,placeholder:opts.ph||''}); input.value=v||'';
  }else{
    input=h('input',{id,type:opts.type||'text',inputmode:opts.im||null,placeholder:opts.ph||'',class:opts.code?'code':null,autocomplete:opts.ac||'off',autocapitalize:opts.code?'characters':null}); input.value=v??'';
  }
  input.addEventListener(opts.options?'change':'input',()=>{ setP(obj,path,input.value); touch(); opts.after&&opts.after(input.value); });
  return h('label',{class:'f',for:id},h('span',null,label),input);
}
function check(obj,path,label,idp=''){
  const id='c-'+idp+path; const i=h('input',{type:'checkbox',id,checked:!!getP(obj,path)});
  i.addEventListener('change',()=>{ setP(obj,path,i.checked); touch(); });
  return h('label',{class:'check',for:id},i,label);
}
function seg(obj,path,label,options){
  const box=h('div',{class:'seg',role:'group','aria-label':label});
  const draw=()=>{ box.replaceChildren(...options.map(o=>h('button',{type:'button','aria-pressed':String(getP(obj,path)===o),onclick:()=>{setP(obj,path,o);touch();draw();}},o))); };
  draw();
  return h('div',{class:'f'},h('span',{style:'font-size:12px;font-weight:600;color:var(--muted)'},label),box);
}
function section(title, ...kids){ return h('section',{class:'sec'},h('h2',null,title),h('div',{class:'body'},...kids)); }

function openJob(id){
  current = jobs.find(j=>j.id===id); if(!current) return showList();
  window.scrollTo(0,0);
  $('#backBtn').hidden=false; $('#saveState').hidden=false; $('#saveState').textContent=storageOK?'Saved':'Not saved on this phone';
  $('#barSub').textContent = current.customer.name || 'New survey';
  $('#dockInner').replaceChildren(h('button',{class:'btn btn-sun btn-block',id:'packBtn',onclick:makePack},'Make & send job pack'));
  renderEditor();
}

  const j=current, app=$('#app'); app.replaceChildren();
  if(j.example) app.append(h('div',{class:'notice'},'This is an example job so you can see how a pack looks. Make the pack to try it, then delete it at the bottom.'));

  app.append(section('Job',
    h('div',{class:'grid2 keep'}, field(j,'status','Status',{options:STATUSES,after:()=>{}}), field(j,'ref','Quote ref',{code:true,ph:'e.g. 3058'})),
    h('div',{class:'grid2 keep'}, field(j,'surveyDate','Survey date',{type:'date'}), field(j,'surveyor','Surveyed by')),
    h('div',{class:'grid2 keep'}, field(j,'installDate','Install date',{type:'date'}), field(j,'installers','Installers',{ph:'Names'}))
  ));
  app.append(section('Customer',
    field(j,'customer.name','Name',{ac:'name',after:v=>$('#barSub').textContent=v||'New survey'}),
    h('div',{class:'grid2'}, field(j,'customer.phone','Phone',{type:'tel',ac:'tel'}), field(j,'customer.email','Email',{type:'email',ac:'email'})),
    field(j,'customer.address','Address',{ph:'House, street, town',ac:'street-address'}),
    field(j,'customer.postcode','Postcode',{code:true,ac:'postal-code'})
  ));
  const flashHint=h('p',{class:'hint'});
  const updFlash=()=>{ const f=FLASH_HINT[j.site.roof]; flashHint.replaceChildren(...(f?['Flashing family for this roof: ',h('b',null,f)]:['Check the flashing system for this roof covering.'])); };
  updFlash();
  app.append(section('Site & access',
    field(j,'site.property','Property',{ph:'e.g. Detached bungalow, loft conversion'}),
    h('div',{class:'grid2 keep'}, field(j,'site.roof','Roof covering',{options:ROOFS,after:updFlash}), field(j,'site.storeys','Storeys',{type:'number',im:'numeric'})),
    flashHint,
    seg(j,'site.access','Internal access',['Stairs','Loft ladder','Other']),
    field(j,'site.accessNotes','Access notes',{ph:'Narrow stairs, low ceilings, furniture…'}),
    seg(j,'site.inside','Work from inside',['Yes','No','Check']),
    seg(j,'site.scaffold','Scaffold',['Not needed','Needed','Check']),
    field(j,'site.parking','Parking',{ph:'Driveway, permit, road…'}),
    field(j,'site.hazards','Hazards & pets',{area:true,ph:'Asbestos risk, pets, fragile items, conservatory below…'}),
    check(j,'site.clearRooms','Customer told to clear rooms and move fragile items')
  ));

  const winBox=h('div',{style:'display:grid;gap:12px'});
  const drawWins=()=>{ winBox.replaceChildren(...j.windows.map((w,i)=>windowCard(w,i,drawWins))); drawMats(); };
  const addBtn=h('button',{class:'btn btn-ghost btn-block',type:'button',onclick:()=>{ j.windows.push(newWindow()); touch(); drawWins(); winBox.lastChild.scrollIntoView({behavior:'smooth',block:'start'}); }},'+ Add another window');
  app.append(section('Windows', winBox, addBtn));

  const matBox=h('ul',{class:'mats'});
  const drawMats=()=>{ const m=materials(j); matBox.replaceChildren(...(m.length?m.map(([c,q])=>h('li',null,h('span',null,c),h('span',null,'× '+q))):[h('li',null,h('span',null,'Add product codes to the windows above'),h('span',null,''))])); };
  app.append(section('Materials for the van', matBox, h('p',{class:'hint'},'Built from the codes on each window. No prices go in the job pack.')));
  drawWins();

  app.append(section('Notes for installers', field(j,'notes','Anything the team should know',{area:true,ph:'Parking, key safe, customer preferences, where to put waste…'})));
  app.append(section('Other photos', photoBlock(j.photos,'gen')));

  const del=h('button',{class:'btn btn-danger',type:'button'},'Delete this job');
  let armed=false;
  del.addEventListener('click',async()=>{ if(!armed){ armed=true; del.textContent='Tap again to delete for good'; setTimeout(()=>{armed=false; del.textContent='Delete this job';},4000); return; }
    await delJob(j.id); jobs=jobs.filter(x=>x.id!==j.id); toast('Job deleted'); showList(); });
  app.append(h('div',{class:'danger-zone'},del));

  // keep materials in sync with code fields
  app.addEventListener('input',e=>{ if(e.target.classList.contains('code')) drawMats(); });
}

function windowCard(w,i,redraw){
  const j=current, idp='w'+w.id+'-';
  const title=h('strong',null,w.room||'Window '+(i+1));
  const hint=h('p',{class:'hint'});
  const updHint=()=>{ const s= w.make==='VELUX'?suggestFor(w.existing):''; hint.hidden=!s && w.make==='VELUX';
    hint.replaceChildren(...(w.make!=='VELUX' ? ['Non-VELUX: measure frame and reveals, same-size VELUX plus a size-matched ',h('b',null,'ELX'),' adaptor.'] : s ? ['Replacement size: ',h('b',null,s),'. Confirm the ID plate.'] : [])); };
  updHint();
  const rm=h('button',{class:'iconbtn',type:'button',style:'color:var(--bad);border-color:var(--line)'},'Remove');
  let armed=false;
  rm.addEventListener('click',()=>{ if(!armed){armed=true;rm.textContent='Sure?';setTimeout(()=>{armed=false;rm.textContent='Remove';},3000);return;} j.windows.splice(i,1); touch(); redraw(); });
  return h('div',{class:'win'},
    h('div',{class:'win-head'},h('span',{class:'win-num'},'W'+(i+1)),title, j.windows.length>1?rm:null),
    h('div',{class:'body',style:'display:grid;gap:12px'},
      field(w,'room','Room / location',{idp,ph:'e.g. Bedroom 2, front',after:v=>title.textContent=v||'Window '+(i+1)}),
      h('div',{class:'sub'},'Existing window'),
      h('div',{class:'grid2 keep'}, field(w,'make','Make',{idp,options:MAKES,after:updHint}), field(w,'existing','ID plate / type',{idp,code:true,ph:'GGL 4',after:updHint})),
      hint,
      h('div',{class:'grid3 keep'}, field(w,'w','Width mm',{idp,type:'number',im:'numeric'}), field(w,'h','Height mm',{idp,type:'number',im:'numeric'}), field(w,'pitch','Pitch °',{idp,type:'number',im:'numeric'})),
      h('div',{class:'sub'},'Replacement'),
      h('div',{class:'grid2'}, field(w,'newCode','New window code',{idp,code:true,ph:'GGU SK06 0070'}), field(w,'op','Operation',{idp,options:OPS})),
      h('div',{class:'grid2'}, field(w,'flashing','Flashing code',{idp,code:true,ph:'EDW SK06 1000'}), field(w,'adaptor','Adaptor code',{idp,code:true,ph:'ELX SK06 0000'})),
      field(w,'blind','Blind code (only if ordered)',{idp,code:true,ph:'Leave blank if none'}),
      h('div',{class:'grid3'}, check(w,'trim','uPVC finishing trim',idp), check(w,'combo','Combination flashing',idp), check(w,'scaffold','Needs scaffold',idp)),
      field(w,'notes','Notes',{idp,area:true,ph:'Lining, structure, damp, blinds to keep…'}),
      h('div',{class:'sub'},'Photos'),
      photoBlock(w.photos, idp)
    ));
}

function photoBlock(arr, idp){
  const grid=h('div',{class:'photos'});
  const draw=()=>{ grid.replaceChildren(...arr.map((p,k)=>{
    const inp=h('input',{type:'text',placeholder:'Caption',id:'cap-'+p.id,'aria-label':'Photo caption'}); inp.value=p.caption||'';
    inp.addEventListener('input',()=>{ p.caption=inp.value; touch(); });
    return h('div',{class:'ph'},h('img',{src:p.data,alt:p.caption||'Survey photo'}),
      h('div',{class:'cap'},inp,h('button',{class:'x',type:'button','aria-label':'Remove photo',onclick:()=>{arr.splice(k,1);touch();draw();}},'✕')),
      h('div',{class:'capchips'},CAPS.map(c=>h('button',{type:'button',onclick:()=>{p.caption=c;inp.value=c;touch();}},c))));
  })); };
  draw();
  const mk=(label,capture)=>{ const id='ph-'+idp+(capture?'cam':'lib');
    const i=h('input',{type:'file',accept:'image/*',id,multiple:!capture,capture:capture?'environment':null});
    i.addEventListener('change',async()=>{ const files=[...i.files]; i.value=''; if(!files.length) return; toast('Adding '+files.length+' photo'+(files.length>1?'s':'')+'…');
      for(const f of files){ try{ arr.push(await compress(f)); }catch(e){ toast('One photo couldn’t be read. Try a JPEG or PNG.'); } }
      touch(); draw(); });
    return h('label',{class:'btn',for:id},label,i); };
  return h('div',{style:'display:grid;gap:10px'}, grid, h('div',{class:'addph'}, mk('Take photo',true), mk('Choose photos',false)));
}
function compress(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const max=1600; const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.round(img.naturalWidth*s), hh=Math.round(img.naturalHeight*s);
      const c=document.createElement('canvas'); c.width=w; c.height=hh; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,hh); x.drawImage(img,0,0,w,hh);
      URL.revokeObjectURL(url); res({id:uid(), data:c.toDataURL('image/jpeg',0.8), w, h:hh, caption:''}); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src=url;
  });
}

/* ---------- PDF job pack ---------- */
function buildPdf(j){
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4',compress:true});
  const W=210,H=297,M=14,CW=W-2*M, BOTTOM=H-20;
  const NAVY=[23,52,74], SUN=[242,182,50], INK=[31,46,56], MUTED=[90,108,120], LINE=[214,224,231], PANEL=[238,245,250];
  const clean=s=>String(s??'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...');
  let y=0;

  const markAt=(x,yy,s)=>{ doc.setFillColor(...SUN); doc.roundedRect(x,yy,s,s,2,2,'F');
    const k=s/40; doc.setFillColor(...NAVY);
    doc.lines([[15*k,-14*k],[15*k,14*k],[-4*k,0],[0,16*k],[-9*k,0],[0,-11*k],[-4*k,0],[0,11*k],[-9*k,0],[0,-16*k]], x+5*k, yy+18*k, [1,1], 'F', true);
    doc.setFillColor(255,255,255); doc.rect(x+16*k,yy+12*k,9*k,8*k,'F'); };

  const ref = j.ref ? 'Ref '+j.ref : 'No quote ref';
  const LOGO = window.DD_LOGO;
  function firstHeader(){
    if(LOGO){ try{ doc.addImage(LOGO,'JPEG',M-2,8,53.6,30); }catch(e){ markAt(M,10,18); } } else markAt(M,10,18);
    doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(...NAVY); doc.text('INSTALLER JOB PACK',W-M,19,{align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...INK);
    doc.text(clean(ref+'  |  Status: '+statusLabel(j.status)),W-M,26,{align:'right'});
    doc.text(clean('Surveyed '+fmtDate(j.surveyDate)+(j.surveyor?' by '+j.surveyor:'')),W-M,31,{align:'right'});
    doc.setFillColor(...NAVY); doc.rect(0,41,W,1.6,'F'); doc.setFillColor(...SUN); doc.rect(0,42.6,W,1.2,'F');
    y=53;
  }
  function smallHeader(){
    if(LOGO){ try{ doc.addImage(LOGO,'JPEG',M-1,3,19.6,11); }catch(e){} }
    doc.setTextColor(...NAVY); doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.text('INSTALLER JOB PACK',M+22,10);
    doc.setFont('helvetica','normal'); doc.setTextColor(...INK); doc.text(clean((j.customer.name||'')+'  '+ (j.customer.postcode||'')+'  '+ref),W-M,10,{align:'right'});
    doc.setFillColor(...NAVY); doc.rect(0,15.5,W,0.8,'F'); doc.setFillColor(...SUN); doc.rect(0,16.3,W,0.6,'F');
    y=25;
  }
  function ensure(hh){ if(y+hh>BOTTOM){ doc.addPage(); smallHeader(); } }
  function title(t, sub){
    ensure(16);
    doc.setFillColor(...SUN); doc.rect(M,y-3.6,2.2,4.6,'F');
    doc.setTextColor(...NAVY); doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.text(clean(t),M+4.5,y);
    if(sub){ doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...MUTED); doc.text(clean(sub),W-M,y,{align:'right'}); }
    y+=3; doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M,y,W-M,y); y+=6;
  }
  function kv(pairs, cols=2){
    pairs=pairs.filter(p=>p[1]!==''&&p[1]!=null&&p[1]!==false);
    const gap=6, cw=(CW-gap*(cols-1))/cols;
    for(let i=0;i<pairs.length;i+=cols){
      const row=pairs.slice(i,i+cols);
      const blocks=row.map(([k,v])=>{ doc.setFont('helvetica','normal'); doc.setFontSize(10); return {k, lines:doc.splitTextToSize(clean(v),cw)}; });
      const rh=4+Math.max(...blocks.map(b=>b.lines.length))*4.6+2.5;
      ensure(rh);
      blocks.forEach((b,c)=>{ const x=M+c*(cw+gap);
        doc.setFont('helvetica','bold'); doc.setFontSize(7.2); doc.setTextColor(...MUTED); doc.text(clean(b.k).toUpperCase(),x,y);
        doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...INK); doc.text(b.lines,x,y+4.6); });
      y+=rh;
    }
  }
  function para(text, opts={}){
    if(!text) return;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...INK);
    const lines=doc.splitTextToSize(clean(text), CW-(opts.panel?8:0));
    if(opts.panel){ let i=0; while(i<lines.length){ ensure(12); const fit=Math.max(1,Math.floor((BOTTOM-y-4)/4.8)); const chunk=lines.slice(i,i+fit);
        const hh=chunk.length*4.8+5; doc.setFillColor(...PANEL); doc.roundedRect(M,y-1,CW,hh,2,2,'F'); doc.setTextColor(...INK); doc.text(chunk,M+4,y+3.6); y+=hh+3; i+=chunk.length; } return; }
    for(const ln of lines){ ensure(5); doc.text(ln,M,y); y+=4.8; } y+=2;
  }
  function photos(list){
    if(!list.length) return;
    const gap=6, cw=(CW-gap)/2, maxH=72;
    for(let i=0;i<list.length;i+=2){
      const row=list.slice(i,i+2).map(p=>{ let w=cw, hh=cw*(p.h/p.w); if(hh>maxH){ hh=maxH; w=hh*(p.w/p.h); } return {p,w,hh}; });
      const rh=Math.max(...row.map(r=>r.hh))+9;
      ensure(rh);
      row.forEach((r,c)=>{ const x=M+c*(cw+gap);
        doc.setFillColor(...PANEL); doc.rect(x,y,cw,Math.max(...row.map(q=>q.hh)),'F');
        try{ doc.addImage(r.p.data,'JPEG',x+(cw-r.w)/2,y,r.w,r.hh,undefined,'FAST'); }catch(e){}
        doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...MUTED);
        doc.text(clean((r.p.caption||'Photo '+(i+c+1))),x,y+Math.max(...row.map(q=>q.hh))+4.5,{maxWidth:cw}); });
      y+=rh+2;
    }
  }

  firstHeader();
  // Customer & job
  title('Customer & visit');
  kv([['Customer',j.customer.name||'Not recorded'],['Phone',j.customer.phone],['Address',[j.customer.address,j.customer.postcode].filter(Boolean).join(', ')],['Email',j.customer.email],
      ['Install date',j.installDate?fmtDate(j.installDate):'To be confirmed'],['Installers',j.installers]]);
  y+=2;
  // Summary + materials
  const mats=materials(j);
  title('Materials to load', j.windows.length+' window'+(j.windows.length===1?'':'s'));
  if(mats.length){
    mats.forEach(([c,q],k)=>{ ensure(7); if(k%2===0){ doc.setFillColor(...PANEL); doc.rect(M,y-4.4,CW,6.4,'F'); }
      doc.setFont('courier','bold'); doc.setFontSize(10.5); doc.setTextColor(...INK); doc.text(clean(c),M+3,y);
      doc.setFont('helvetica','bold'); doc.text('x '+q,W-M-3,y,{align:'right'}); y+=6.4; });
    y+=3;
  } else para('No product codes recorded yet.');
  // Site
  title('Site & access');
  const flags=[];
  if(j.site.inside==='No') flags.push('NOT working from inside');
  if(j.site.inside==='Check') flags.push('Check if work from inside is possible');
  if(j.site.scaffold==='Needed') flags.push('SCAFFOLD NEEDED');
  if(j.site.scaffold==='Check') flags.push('Scaffold to be checked');
  if(j.windows.some(w=>w.scaffold)) flags.push('Scaffold needed for some windows');
  if(flags.length){ ensure(10); doc.setFillColor(...SUN); const t=clean(flags.join('  |  ')); doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
    const ls=doc.splitTextToSize(t,CW-8); const hh=ls.length*4.6+4; doc.roundedRect(M,y-1,CW,hh,2,2,'F'); doc.setTextColor(...NAVY); doc.text(ls,M+4,y+3.4); y+=hh+4; }
  kv([['Property',j.site.property],['Roof covering',j.site.roof],['Storeys',j.site.storeys],['Internal access',j.site.access],['Access notes',j.site.accessNotes],
      ['Work from inside',j.site.inside],['Scaffold',j.site.scaffold],['Parking',j.site.parking],['Hazards & pets',j.site.hazards],
      ['Rooms cleared',j.site.clearRooms?'Customer asked to clear rooms':'Not agreed, check on arrival']]);
  if(j.notes){ title('Notes for installers'); para(j.notes,{panel:true}); }

  // Windows
  j.windows.forEach((w,i)=>{
    if(y>BOTTOM-70){ doc.addPage(); smallHeader(); }
    title('Window '+(i+1)+(w.room?'  -  '+w.room:''), w.newCode?w.newCode.toUpperCase():'');
    const size=(w.w||w.h)?(w.w||'?')+' x '+(w.h||'?')+' mm':'';
    const extras=[w.trim&&'uPVC finishing trim',w.combo&&'Combination flashing',w.scaffold&&'Scaffold needed'].filter(Boolean).join(', ');
    kv([['Existing',[w.make,(w.existing||'').toUpperCase()].filter(Boolean).join(' ')],['Opening size',size],['Pitch',w.pitch?w.pitch+' deg':''],['Operation',w.op],
        ['New window',(w.newCode||'').toUpperCase()],['Flashing',(w.flashing||'').toUpperCase()],['Adaptor',(w.adaptor||'').toUpperCase()],['Blind',(w.blind||'').toUpperCase()],
        ['Extras',extras]]);
    if(w.notes) para(w.notes,{panel:true});
    photos(w.photos);
    y+=2;
  });
  if(j.photos.length){ title('Other photos'); photos(j.photos); }

  // Completion checklist
  ensure(70); title('On completion');
  ['All windows open, close and lock correctly','Flashings fitted and roof covering reinstated','Minor plaster pops filled, area clean, waste removed','Customer shown how to operate windows and blinds','Photos of finished windows taken inside and out'].forEach(t=>{
    ensure(8); doc.setDrawColor(...NAVY); doc.setLineWidth(0.4); doc.rect(M,y-3.6,4.2,4.2); doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...INK); doc.text(t,M+7,y); y+=7.5; });
  y+=4; ensure(14); doc.setDrawColor(...LINE); doc.line(M,y+6,M+80,y+6); doc.line(W-M-60,y+6,W-M,y+6);
  doc.setFontSize(8); doc.setTextColor(...MUTED); doc.text('Installer signature',M,y+10); doc.text('Date',W-M-60,y+10);

  // Footers
  const n=doc.getNumberOfPages();
  for(let p=1;p<=n;p++){ doc.setPage(p);
    doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M,H-13,W-M,H-13);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...MUTED);
    doc.text('The Daylight Doctor Ltd  |  87 London Road, Cowplain, PO8 8XB  |  0800 448 0184  |  For our installation team only',M,H-8.5);
    doc.text('Page '+p+' of '+n,W-M,H-8.5,{align:'right'}); }
  return doc;
}
function packName(j){
  const bits=['Job pack', j.ref, j.customer.name, j.customer.postcode].filter(Boolean).join(' ');
  return bits.replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim().slice(0,90)+'.pdf';
}
async function makePack(){
  const btn=$('#packBtn'); if(!btn) return;
  if(!window.jspdf){ toast('The PDF maker hasn’t loaded. Check your signal and reopen the page.',4000); return; }
  clearTimeout(saveT); await putJob(current);
  btn.disabled=true; btn.textContent='Making job pack…';
  try{
    const doc=buildPdf(current); const blob=doc.output('blob'); const name=packName(current);
    const file=new File([blob],name,{type:'application/pdf'});
    let done=false;
    try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name,text:'Job pack for '+(current.customer.name||'survey')}); done=true; toast('Job pack shared'); } }
    catch(e){ if(e && e.name==='AbortError'){ done=true; } }
    if(!done){
      let dl=null; try{ dl = window.claude && await window.claude.use('downloads'); }catch(e){}
      if(dl){ try{ await dl.save({filename:name,data:blob}); done=true; toast('Job pack saved. Send it from your Files app or WhatsApp.',4200); }
        catch(e){ done=true; if(e&&e.code==='declined') toast('Not saved'); else toast('Couldn’t save the PDF here. Try again in a moment.'); } }
    }
    if(!done){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); a.remove(); toast('Job pack downloaded'); }
  }catch(e){ console.error(e); toast('Something went wrong making the pack. Your survey is saved.',4000); }
  finally{ btn.disabled=false; btn.textContent='Make & send job pack'; }
}
window.__dd = {buildPdf, exampleJob, materials};

$('#backBtn').addEventListener('click', async()=>{ clearTimeout(saveT); if(current) await putJob(current); showList(); });
try{ if('serviceWorker' in navigator && window.isSecureContext && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
load();
})();
